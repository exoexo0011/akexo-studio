<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons: each tag points to a PNG rendered at its NATIVE pixel size
         (generated from public/logo-icon.png by scripts/generate-favicons.mjs).
         Browsers pick the closest size and skip rescaling, which is what
         keeps the tab icon crisp on hi-DPI displays. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicons/favicon-128.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32.png" />
    <link rel="shortcut icon" href="/favicons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050507" />
    <meta
      name="description"
      content="AkExo Studio is the solo AI dev studio of one engineer. Sites, apps, AI tools, and automations, with a 14-day median delivery."
    />
    <meta property="og:title" content="AkExo Studio · Solo AI Dev Studio" />
    <meta
      property="og:description"
      content="Sites, apps, AI tools, and automations. Written and shipped by one engineer in 14 days."
    />
